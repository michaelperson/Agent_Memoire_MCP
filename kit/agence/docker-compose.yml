services:
  postgres:
    image: postgres:18
    env_file: .env
    volumes:
      - "pg_data:/var/lib/postgresql"
      - "./init:/docker-entrypoint-initdb.d:ro"
  n8n:
    image: n8nio/n8n:2.47.7
    env_file: .env
    ports: ["5678:5678"]
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on: [postgres]
  mail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.users=agence:agence@agence.test"
    ports: ["3025:3025", "3143:3143"]
volumes: { pg_data: {}, n8n_data: {} }
